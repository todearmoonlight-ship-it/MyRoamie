<style>*{box-sizing:border-box}html{width:100%;max-width:100%;overflow-x:hidden;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0 auto;width:100%;max-width:448px;min-height:100vh;overflow-x:hidden;background:#FDFBF7;background-image:radial-gradient(#E8DFD3 1.1px,transparent 1.1px);background-size:18px 18px;font-family:'Zen Maru Gothic',sans-serif;color:#4A3E3D;-webkit-tap-highlight-color:transparent}button,a,label,.tap{touch-action:manipulation}@media(max-width:480px){input,select,textarea{font-size:16px!important}}.page{display:none}.page.active{display:block}.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}.btn:active{transform:scale(.97)}#bottom-nav{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity}#bottom-nav .nav-btn{flex:0 0 auto;min-width:66px;scroll-snap-align:center;color:#8e8e93}#bottom-nav .nav-btn.active{color:#38A1DB;font-weight:700}#date-picker,#favorite-tabs,#check-tabs{position:sticky;top:67px;z-index:25;background:rgba(253,251,247,.96);backdrop-filter:blur(10px);padding:8px 2px}.modal{overflow-y:auto;-webkit-overflow-scrolling:touch}.modal-card{max-height:calc(100dvh - 24px);display:flex;flex-direction:column;overflow:hidden}.modal-body{overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}.media-loading{background:#f2eee7;min-height:120px}.schedule-img{width:100%;height:178px;object-fit:cover;border-radius:14px;background:#f2eee7;border:1px solid #EADBCE}.recommend-img{width:100%;height:170px;object-fit:contain;border-radius:14px;background:#f7f4eb;border:1px solid #EADBCE;padding:6px}.receipt-img{width:100%;max-height:280px;object-fit:contain;border-radius:14px;background:#f7f4eb}.timeline:before{content:'';position:absolute;left:22px;top:6px;bottom:6px;width:2px;background:#EADBCE}.safe-bottom{padding-bottom:calc(86px + env(safe-area-inset-bottom))}#splash{background-position:center;background-size:cover}.fade{transition:.25s}.fade.hide{o <body class="safe-bottom">

<header class="sticky top-0 z-30 bg-[#FDFBF7]/95 backdrop-blur-md border-b border-sand p-3"><div class="flex items-center justify-between gap-2"><button onclick="openTripManager()" class="min-w-0 flex items-center gap-2 text-left btn"><div class="w-9 h-9 rounded-xl bg-skyLight text-skyBlue flex items-center justify-center shrink-0"><i class="fa-solid fa-suitcase-rolling"></i></div><div class="min-w-0"><div id="header-title" class="font-bold text-wood truncate">TripBook</div><div id="header-subtitle" class="text-[10px] text-gray-400 truncate"></div></div></button><div class="flex items-center gap-1 shrink-0"><a id="manual-btn" target="_blank" rel="noopener" class="hidden w-9 h-9 rounded-full bg-card border border-sand text-amber-500 flex items-center justify-center btn" title="旅遊手冊"><i class="fa-solid fa-book-open"></i></a><button id="map-btn" onclick="openTripMap()" class="w-9 h-9 rounded-full bg-card border border-sand text-skyBlue flex items-center justify-center btn" title="Google Maps"><i class="fa-solid fa-earth-asia"></i></button><button id="coupon-btn" onclick="openCoupons()" class="hidden w-9 h-9 rounded-full bg-card border border-sand text-torii flex items-center justify-center btn" title="優惠券"><i class="fa-solid fa-ticket"></i></button></div></div></header>
<main class="p-4">
<section id="page-bookings" class="page active space-y-4"><div class="bg-card rounded-2xl border border-sand shadow-soft p-4"><div class="flex items-center justify-between gap-2"><div><div class="font-bold text-sm"><i class="fa-solid fa-folder-open text-torii mr-1"></i>旅遊憑證</div><div class="text-[10px] text-gray-400 mt-1">機票、飯店、門票 PDF／圖片存在本裝置。</div></div><label class="px-3 py-2 bg-sakuraLight text-torii rounded-xl text-xs font-bold cursor-pointer btn">上傳<input id="credential-input" type="file" accept="application/pdf,image/*,.pdf,.jpg,.jpeg,.png,.webp,.heic,.heif" multiple class="hidden"></label></div><div id="credential-list" class="space-y-2 mt-3"></div></div><div class="grid grid-cols-3 gap-2"><button onclick="openBookingEditor('flight')" class="py-2.5 rounded-xl bg-skyLight text-skyBlue font-bold text-xs btn"><i class="fa-solid fa-plane mr-1"></i>航班</button><button onclick="openBookingEditor('hotel')" class="py-2.5 rounded-xl bg-sakuraLight text-torii font-bold text-xs btn"><i class="fa-solid fa-hotel mr-1"></i>住宿</button><button onclick="openBookingEditor('transport')" class="py-2.5 rounded-xl bg-card border border-sand text-wood font-bold text-xs btn"><i class="fa-solid fa-train mr-1"></i>交通</button></div><div id="booking-list" class="space-y-3"></div></section>
<section id="page-schedule" class="page space-y-4"><div id="weather-card" class="bg-card rounded-2xl border border-sand shadow-soft p-3"></div><div class="flex gap-2"><button onclick="openBatchImport()" class="flex-1 py-2.5 rounded-xl bg-skyLight text-skyBlue font-bold text-xs btn"><i class="fa-solid fa-file-arrow-up mr-1"></i>批次匯入</button><button onclick="openScheduleEditor()" class="flex-1 py-2.5 rounded-xl bg-card border border-sand font-bold text-xs btn"><i class="fa-solid fa-plus mr-1"></i>新增行程</button></div><div id="date-picker" class="flex gap-2 overflow-x-auto no-scrollbar"></div><div id="day-route-toolbar" class="flex items-center justify-between gap-2"></div><div id="timeline" class="relative timeline space-y-4"></div></section>
<section id="page-expense" class="page space-y-4"><div class="bg-card rounded-2xl border border-sand shadow-soft p-4"><div class="flex justify-between items-start"><div><div class="text-[10px] text-gray-400">旅行總預算</div><div class="font-bold text-xl"><span id="budget-currency">TWD</span> <span id="budget-total">0</span></div></div><button onclick="editBudget()" class="text-skyBlue text-xs font-bold btn">修改</button></div><div class="mt-3 h-2 bg-sand rounded-full overflow-hidden"><div id="budget-bar" class="h-full bg-skyBlue" style="width:0"></div></div><div class="grid grid-cols-2 gap-3 mt-3 text-xs"><div>已花 <b id="budget-spent">0</b></div><div class="text-right">剩餘 <b id="budget-left">0</b></div></div></div><div class="grid grid-cols-2 gap-2"><label class="py-3 rounded-xl bg-skyBlue text-white text-center font-bold text-xs cursor-pointer btn"><i class="fa-solid fa-camera mr-1"></i>發票辨識<input id="ocr-input" type="file" accept="image/*" capture="environment" class="hidden" onchange="scanReceiptOCR(this)"></label><button onclick="openExpenseEditor()" class="py-3 rounded-xl bg-card border border-sand font-bold text-xs btn"><i class="fa-solid fa-plus mr-1"></i>手動記帳</button></div><div id="ocr-status" class="text-[10px] text-center text-gray-400">快速辨識金額；第一次使用 OCR 請先連網初始化。</div><div class="bg-card rounded-2xl border border-sand shadow-soft p-4"><div class="flex justify-between mb-2"><b class="text-sm">支出明細</b><button onclick="exportExpenseCSV()" class="text-[10px] text-skyBlue font-bold">匯出 CSV</button></div><div id="expense-list" class="space-y-2"></div></div></section>
<section id="page-favorites" class="page space-y-4"><div id="favorite-tabs" class="flex gap-2 overflow-x-auto no-scrollbar"></div><div class="flex justify-end"><button onclick="openFavoriteEditor()" class="px-3 py-2 rounded-xl bg-skyLight text-skyBlue text-xs font-bold btn"><i class="fa-solid fa-plus mr-1"></i>新增收藏</button></div><div id="favorite-list" class="space-y-3"></div></section>
<section id="page-journal" class="page space-y-4"><div class="flex items-center justify-between"><b>旅行日誌</b><button onclick="openJournalEditor()" class="px-3 py-2 rounded-xl bg-skyLight text-skyBlue text-xs font-bold btn"><i class="fa-solid fa-plus mr-1"></i>新增</button></div><div id="journal-list" class="space-y-3"></div></section>
<section id="page-checklist" class="page space-y-4"><div id="check-tabs" class="flex gap-2 overflow-x-auto no-scrollbar"></div><div class="flex justify-end"><button onclick="openChecklistAdd()" class="px-3 py-2 rounded-xl bg-skyLight text-skyBlue text-xs font-bold btn"><i class="fa-solid fa-plus mr-1"></i>新增項目</button></div><div id="check-list" class="space-y-2"></div></section>
<section id="page-tools" class="page space-y-4"><div class="bg-card rounded-2xl border border-sand shadow-soft p-4 space-y-3"><b>旅程設定</b><button onclick="openTripEditor(activeTrip().id)" class="w-full py-2.5 rounded-xl bg-skyLight text-skyBlue font-bold text-xs btn">編輯目前旅程</button><button onclick="openBatchImport()" class="w-full py-2.5 rounded-xl bg-card border border-sand font-bold text-xs btn">批次匯入 Excel / CSV</button><button onclick="downloadImportTemplate()" class="w-full py-2.5 rounded-xl bg-card border border-sand font-bold text-xs btn">下載行程匯入範本</button></div><div class="bg-card rounded-2xl border border-sand shadow-soft p-4 space-y-3"><b>旅行工具</b><button onclick="refreshWeather(true)" class="w-full py-2.5 rounded-xl bg-card border border-sand font-bold text-xs btn"><i class="fa-solid fa-cloud-sun mr-1"></i>重新整理城市天氣</button><a href="https://translate.google.com/" target="_blank" class="block text-center w-full py-2.5 rounded-xl bg-card border border-sand font-bold text-xs btn"><i class="fa-solid fa-language mr-1"></i>Google 翻譯</a><button onclick="editExchangeRate()" class="w-full py-2.5 rounded-xl bg-card border border-sand font-bold text-xs btn"><i class="fa-solid fa-coins mr-1"></i>修改匯率</button></div><div class="bg-card rounded-2xl border border-sand shadow-soft p-4 space-y-3"><b>資料管理</b><button onclick="exportActiveTrip()" class="w-full py-2.5 rounded-xl bg-skyLight text-skyBlue font-bold text-xs btn">備份目前旅程</button><label class="block text-center w-full py-2.5 rounded-xl bg-card border border-sand font-bold text-xs cursor-pointer btn">匯入旅程備份<input type="file" accept=".json,application/json" class="hidden" onchange="importTripBackup(this)"></label><button onclick="resetCurrentTrip()" class="w-full py-2.5 rounded-xl bg-red-50 text-red-500 font-bold text-xs btn">重製目前旅程資料</button></div></section>
</main>

const HEADER_ALIASES={date:['日期','date','day','日期時間'],time:['時間','time'],title:['行程名稱','景點','景點名稱','行程','location','destination','place','title'],address:['地址','address','map','google maps'],city:['城市','city'],intro:['簡介','intro','description','介紹'],note:['備註','note','notes'],website:['網址','網站','website','url'],reservationUrl:['預約網址','reservation','booking url','預約']};function normHeader(h){const s=String(h||'').trim().toLowerCase();for(const[k,a]of Object.entries(HEADER_ALIASES))if(a.some(x=>s===x.toLowerCase()))return k;return s}function parseDateValue(v){if(v instanceof Date)return v.toISOString().slice(0,10);let s=String(v||'').trim().replace(/\./g,'/').replace(/-/g,'/'),m=s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/);if(m)return`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;m=s.match(/^(\d{1,2})\/(\d{1,2})$/);if(m)return`${activeTrip().info.startDate.slice(0,4)}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;return''}function normalizeRows(rows){return rows.map(r=>{const n={};Object.entries(r).forEach(([k,v])=>n[normHeader(k)]=v);return{date:parseDateValue(n.date),time:String(n.time||'').trim().slice(0,5),title:String(n.title||'').trim(),address:String(n.address||'').trim(),city:String(n.city||activeTrip().info.city||'').trim(),intro:String(n.intro||'').trim(),note:String(n.note||'').trim(),website:String(n.website||'').trim(),reservationUrl:String(n.reservationUrl||'').trim()}}).filter(r=>r.date||r.time||r.title)}

function parseDelimited(text){const lines=text.trim().split(/\r?\n/);if(!lines.length)return[];const delim=lines[0].includes('\t')?'\t':',';const parse=line=>{const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===delim&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out};const h=parse(lines[0]);return lines.slice(1).map(l=>{const a=parse(l);return Object.fromEntries(h.map((x,i)=>[x,a[i]||'']))})}async function readImportFile(input){const f=input.files[0];if(!f)return;try{if(/\.csv$/i.test(f.name))importRows=normalizeRows(parseDelimited(await f.text()));else{if(!window.XLSX)throw new Error('Excel 解析器尚未載入，請先連網開啟一次');const wb=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:true}),ws=wb.Sheets[wb.SheetNames[0]];importRows=normalizeRows(XLSX.utils.sheet_to_json(ws,{defval:'',raw:false}))}renderImportPreview()}catch(e){alert('無法解析：'+e.message)}}function parsePastedImport(){importRows=normalizeRows(parseDelimited(val('import-paste')));renderImportPreview()}function renderImportPreview(){const box=document.getElementById('import-preview'),bad=importRows.filter(r=>!r.date||!r.time||!r.title),good=importRows.filter(r=>r.date&&r.time&&r.title),g={};good.forEach(r=>(g[r.date]||(g[r.date]=[])).push(r));box.innerHTML=`<div class="mt-3 p-3 rounded-xl bg-skyLight text-xs"><b>辨識 ${good.length} 筆</b>${bad.length?`，${bad.length} 筆缺必要欄位`:''}</div><div class="max-h-64 overflow-y-auto mt-2 space-y-2">${Object.entries(g).map(([d,a])=>`<div class="bg-white rounded-xl border border-sand p-2"><b class="text-xs">${fmtDate(d)}</b>${a.map(r=>`<div class="text-xs mt-1">${esc(r.time)}　${esc(r.title)} <span class="text-gray-400">${esc(r.city)}</span></div>`).join('')}</div>`).join('')}</div><div class="mt-3 grid grid-cols-2 gap-2"><button onclick="confirmImport('append')" class="py-3 rounded-xl bg-card border border-sand font-bold">加入目前行程</button><button onclick="confirmImport('rep function wikiLangs(country){const c=String(country||'');if(/日本/.test(c))return['ja','zh','en'];if(/韓/.test(c))return['ko','en'];if(/台灣|臺灣|中國|香港|澳門/.test(c))return['zh','en'];if(/法國/.test(c))return['fr','en'];if(/德國/.test(c))return['de','en'];return['en','zh']}async function searchWikiImage(title,city,country){for(const lang of wikiLangs(country)){const q=[title,city].filter(Boolean).join(' '),url=`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrsearch=${encodeURIComponent(q)}&gsrlimit=1&prop=pageimages|info&piprop=thumbnail&pithumbsize=900&inprop=url`;try{const data=await fetch(url).then(r=>r.json()),p=Object.values(data?.query?.pages||{})[0];if(p?.thumbnail?.source)return{image:p.thumbnail.source,source:p.fullurl||`https://${lang}.wikipedia.org/wiki/${encodeURIComponent(p.title)}`}}catch(e){}}return null}function queueAutoImages(day){if(!navigator.onLine)return;for(const it of day.items||[]){if(it.image||it.autoImage===false||it.autoImageTried||autoImagePending.has(it.id))continue;autoImagePending.add(it.id);setTimeout(()=>runAutoImage(it),60)}}async function runAutoImage(it){if(autoImageRunning>=2){setTimeout(()=>runAutoImage(it),350);return}autoImageRunning++;try{const t=activeTrip(),res=await searchWikiImage(it.title,it.city||t.info.city,t.info.country);it.autoImageTried=true;if(res){const blob=await fetch(res.image).then(r=>r.blob());it.image=await putMediaBlob(blob,'wiki');it.imageSource=res.source;saveState();if(currentPage==='schedule')renderSchedule()}}catch(e){console.warn(e)}finally{autoImagePending.delete(it.id);autoImageRunning--}}
function dayCity(){const day=activeTrip().days[currentDay],a=(day?.items||[]).map(x=>x.city).filter(Boolean);if(!a.length)return activeTrip().info.city;const c={};a.forEach(x=>c[x]=(c[x]||0)+1);return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0]}async function geocodeCity(city,country='',trip=activeTrip()){if(!city)return null;trip.info.geoCache=trip.info.geoCache||{};const key=`${city}|${country}`;if(trip.info.geoCache[key])return trip.info.geoCache[key];const d=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=5&language=zh&format=json`).then(r=>r.json());let a=d.results||[];const x=a[0];if(!x)return null;const g={lat:x.latitude,lon:x.longitude,timezone:x.timezone,country:x.country,name:x.name};trip.info.geoCache[key]=g;saveState();return g}function weatherText(c){if(c===0)return'晴朗';if(c<=3)return'多雲';if(c<=48)return'霧';if(c<=67)return'雨';if(c<=77)return'雪';if(c<=82)return'陣雨';if(c<=99)return'雷雨';return'天氣變化'}async function refreshWeather(force=false){const box=document.getElementById('weather-card');if(!box)return;const t=activeTrip(),city=dayCity()||t.info.city;if(!city){box.innerHTML='<div class="text-xs text-gray-400">尚未設定主要城市</div>';return}const key=`${city}|${currentDay}`,cached=weatherCache.get(key);if(cached&&!force&&Date.now()-cached.at<1200000){box.innerHTML=cached.html;return}box.innerHTML=`<div class="text-xs text-gray-400"><i class="fa-solid fa-spinner fa-spin mr-1"></i>判斷 ${esc(city)} 天氣中…</div>`;try{const g=await geocodeCity(city,t.info.country,t);if(!g)throw new Error();const d=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${g.lat}&longitude=${g.lon}&current=temperature_2m,apparent_temperature,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=16&timezone=${encodeURIComponent(g.timezone||'auto')}`).then(r=>r.json()),date=t.days[currentDay]?.date,idx=(d.daily?.time||[]).indexOf(date);let html;if(idx>=0)html=`<div class="f function openCredDB(){return new Promise((ok,no)=>{const r=indexedDB.open(CRED_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(CRED_STORE))r.result.createObjectStore(CRED_STORE,{keyPath:'id',autoIncrement:true})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function saveCredential(file){const db=await openCredDB();await new Promise((ok,no)=>{const tx=db.transaction(CRED_STORE,'readwrite');tx.objectStore(CRED_STORE).add({tripId:activeTrip().id,name:file.name,type:file.type,size:file.size,createdAt:Date.now(),blob:file});tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}async function allCredentials(){const db=await openCredDB();return new Promise((ok,no)=>{const r=db.transaction(CRED_STORE,'readonly').objectStore(CRED_STORE).getAll();r.onsuccess=()=>ok(r.result||[]);r.onerror=()=>no(r.error)})}async function tripCredentials(){const a=await allCredentials();return a.filter(x=>x.tripId===activeTrip().id||(!x.tripId&&activeTrip().id===state.legacyTripId))}async function renderCredentials(){const box=document.getElementById('credential-list');if(!box)return;const a=await tripCredentials();box.innerHTML=a.length?'':'<div class="text-center text-[10px] text-gray-400 py-2">尚未上傳憑證</div>';for(const x of a){const d=document.createElement('div');d.className='flex items-center gap-2 p-2 rounded-xl bg-white border border-sand';d.innerHTML=`<button onclick="openCredential(${x.id})" class="flex-1 min-w-0 text-left"><div class="font-bold text-xs truncate">${esc(x.name)}</div><div class="text-[9px] text-gray-400">${(x.size/1024/1024).toFixed(1)} MB</div></button><button onclick="deleteCredential(${x.id})" class="text-red-400 px-2"><i class="fa-solid fa-trash"></i></button>`;box.appendChild(d)}}async function getCredential(id){const db=await openCredDB();return new Promise((ok,no)=>{const r=db.transaction(CRED_STORE,'readonly').objectStore(CRED_STORE).get(id);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function openCredential(id){const x=await getCredential(id);if(!x)return;const u=URL.createObjectURL(x.blob);window.open(u,'_blank');setTimeout(()=>URL.revokeObjectURL(u),60000)}async function deleteCredential(id){if(!confirm('刪除此憑證？'))return;const db=await openCredDB();await new Promise((ok,no)=>{const tx=db.transaction(CRED_STORE,'readwrite');tx.objectStore(CRED_STORE).delete(id);tx.oncomplete=ok;tx.onerror=()=>no(tx.error)});renderCredentials()}

function convertHome(e){const t=activeTrip(),a=Number(e.amount)||0;if(e.currency===t.info.homeCurrency)return a;if(e.currency===t.info.travelCurrency)return a*(Number(t.info.rate)||1);return a}function renderExpenses(){const t=activeTrip(),spent=t.expenses.reduce((s,e)=>s+convertHome(e),0),home=t.info.homeCurrency;document.getElementById('budget-currency').textContent=home;document.getElementById('budget-total').textContent=Math.round(t.budget).toLocaleString();document.getElementById('budget-spent').textContent=`${home} ${Math.round(spent).toLocaleString()}`;document.getElementById('budget-left').textContent=`${home} ${Math.max(0,Math.round(t.budget-spent)).toLocaleString()}`;document.getElementById('budget-bar').style.width=`${Math.min(100,spent/t.budget*100||0)}%`;const box=document.getElementById('expense-list');box.innerHTML='';for(const e of t.expenses){const d=document.createElement('div');d.className='p-3 rounded-xl bg-white border border-sand';d.innerHTML=`<div class="flex justify-between gap-2"><div class="min-w-0"><b class="text-xs truncate">${esc(e.note)}</b><div class="text-[9px] text-gray-400">${esc(e.category)}・${esc(e.payMethod)}・${esc(e.time)}</div></div><div class="text-right shrink-0"><b class="text-torii">${esc(e.currency)} ${Number(e.amount).toLocaleString()}</b><div class="text-[9px] text-gray-400">約 ${home} ${Math.round(convertHome(e)).toLocaleString()}</div></div></div>${e.receiptImage?`<div class="mt-2">${mediaImg(e.receiptImage,'receipt-img','收據')}</div>`:''}<div class="flex gap-2 mt-2"><button onclick="openExpenseEditor('${e.id}')" class="flex-1 py-2 rounded-xl bg-skyLight text-skyBlue text-xs font-bold">編輯</button><button onclick="deleteExpense('${e.id}')" class="px-3 py-2 rounded-xl bg-red-50 text-red-500"><i class="fa-solid fa-trash"></i></button></div>`;box.appendChild(d)}hydrateMedia(box)}

async function getOCRWorker(){if(receiptOCRWorkerPromise)return receiptOCRWorkerPromise;receiptOCRWorkerPromise=(async()=>{const w=await Tesseract.createWorker();await w.loadLanguage('eng');await w.initialize('eng');await w.setParameters({tessedit_pageseg_mode:'6',tessedit_char_whitelist:'0123456789,.-¥￥$€₩'});receiptOCRReady=true;return w})().catch(e=>{receiptOCRWorkerPromise=null;throw e});return receiptOCRWorkerPromise}function warmOCR(){if(!receiptOCRWorkerPromise&&window.Tesseract)getOCRWorker().catch(()=>{})}async function prepOCR(file){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1100/im.width,1800/im.height),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(im,0,0,c.width,c.height);const data=x.getImageData(0,0,c.width,c.height);for(let i=0;i<data.data.length;i+=4){let g=.299*data.data[i]+.587*data.data[i+1]+.114*data.data[i+2];g=Math.max(0,Math.min(255,(g-128)*1.38+128));data.data[i]=data.data[i+1]=data.data[i+2]=g}x.putImageData(data,0,0);c.toBlob(b=>b?ok(b):no(new Error('image')),'image/jpeg',.8)};im.onerror=no;im.src=r.result};r.onerror=no;r.readAsDataURL(file)})}function amountCandidates(txt){const a=[];for(const m of String(txt||'').matchAll(/[¥￥$€₩]?\s*(\d{1,3}(?:[,.]\d{3})+|\d{2,7})/g)){const n=parseInt(m[1].replace(/[,.]/g,''),10);if(n>=10&&n<=1000000&&!a.includes(n))a.push(n)}return a.sort((x,y)=>y-x).slice(0,4)}async function scanReceiptOCR(input){const file=input.files[0];if(!file)return;const status=document.getElementById('ocr-status');status.textContent=receiptOCRReady?'辨識中…':'第一次載入 OCR 並辨識中…';let photo='';try{photo=await compressImage(file,900,.68)}catch(e){}try{const worker=await getOCRWorker(),ret=await worker.recognize(await prepOCR(file)),c=amountCandidates(ret.data.text);window._ocrPending={photo,c};showOCRCandidates(c,photo);status.textContent='辨識完成，請確認金額'}catch(e){window._ocrPending={photo,c:[]};showOCRCandidates([],photo);status.textContent='OCR 失敗，請手動輸入金額'}finally{input.value=''}}function showOCRCandidates(c,photo){openModal('確認發票金額',`${photo?`<img src="${photo}" class="receipt-img">`:''}<div class="space-y-2">${c.map((n,i)=>`<button onclick="document.getElementById('ocr-amount').value='${n}'" class="w-full p-3 rounded-xl border border-sand bg-white flex justify-between"><span>候選 ${i+1}</span><b>${activeTrip().info.travelCurrency} ${n.toLocaleString()}</b></button>`).join('')||'<div class="text-xs text-gray-400">未找到可靠金額，請手動輸入。</div>'}</div><input id="ocr-amount" type="number" inputmode="numeric" value="${c[0]||''}" placeholder="確認金額" class="w-full p-3 bg-white rounded-xl border border-sand"><button id="ocr-confirm" onclick="confirmOCR()" class="w-full py-3 rounded-xl bg-skyBlue text-white font-bold">確認並記帳</button>`)}async function confirmOCR(){const btn=document.getElementById('ocr-confirm');if(btn.disabled)return;const n=Number(val('ocr-amount'));if(!n)return alert('請輸入金額');btn.disabled=true;btn.textContent='儲存中…';const p=window._ocrPending||{};try{const ref=p.photo?await putMediaDataUrl(p.photo,'receipt'):'';activeTrip().expenses.unshift({id:uid('exp'),note:'發票相片拍錄',amount:n,currency:activeTrip().info.travelCurrency,category:'購物',payMethod:'現金',time:new Date().toLocaleString('zh-TW',{hour12:false}),receiptImage:ref});saveState();window._ocrPending=null;renderExpenses();closeModal();document.getElementById('ocr-status').textContent=`已加入 ${activeTrip().info.travelCurrency} ${n.toLocaleString()}，可繼續辨識下一張。`}catch(e){btn.disabled=false;btn.textContent='確認並記帳';alert('儲存失敗')}}
function renderFavorites(){const t=activeTrip(),tabs=document.getElementById('favorite-tabs'),box=document.getElementById('favorite-list'),cats=Object.keys(t.favorites||{});if(!cats.includes(activeFavoriteCat))activeFavoriteCat=cats[0]||'必買';tabs.innerHTML='';cats.forEach(c=>{const b=document.createElement('button');b.className=`chip px-3 py-2 rounded-xl border text-xs font-bold ${c===activeFavoriteCat?'bg-skyBlue text-white border-skyBlue':'bg-white border-sand'}`;b.textContent=c;b.onclick=()=>{activeFavoriteCat=c;renderFavorites()};tabs.appendChild(b)});box.innerHTML='';const arr=t.favorites[activeFavoriteCat]||[];if(!arr.length)box.innerHTML='<div class="text-center text-xs text-gray-400 py-8">此分類尚無收藏。</div>';arr.forEach((x,i)=>{const d=document.createElement('div');d.className='bg-card rounded-2xl border border-sand shadow-soft p-3';if(activeFavoriteCat==='購物清單')d.innerHTML=`<label class="flex items-center gap-3"><input type="checkbox" ${x.checked?'checked':''} onchange="activeTrip().favorites['購物清單'][${i}].checked=this.checked;saveState();renderFavorites()"><span class="${x.checked?'line-through text-gray-400':''}">${esc(x.name)}</span></label>`;else d.innerHTML=`<b>${esc(x.name)}</b>${x.image?`<div class="mt-2">${mediaImg(x.image,'recommend-img',x.name)}</div>`:''}${x.note?`<div class="text-xs text-gray-600 mt-2">${esc(x.note)}</div>`:''}${x.location?`<a target="_blank" href="${mapsSearch(x.location)}" class="text-[10px] text-skyBlue font-bold mt-2 inline-block"><i class="fa-solid fa-map-location-dot"></i> ${esc(x.location)}</a>`:''}<button onclick="deleteFavorite(${i})" class="block ml-auto mt-2 text-[10px] text-red-400">刪除</button>`;box.appendChild(d)});hydrateMedia(box)}function openFavoriteEditor(){openModal(`新增「${activeFavoriteCat}」`,activeFavoriteCat==='購物清單'?`<input id="f-name" placeholder="購物項目" class="w-full p-3 bg-white rounded-xl border border-sand"><button onclick="saveFavorite()" class="w-full py-3 rounded-xl bg-skyBlue text-white font-bold">新增</b aDataUrl(await compressImage(f,1000,.75),'journal',isMediaRef(x.img)?x.img:'');if(!id)arr.unshift(x);saveState();renderJournal();closeModal()}function deleteJournal(id){if(confirm('刪除此日誌？')){activeTrip().journals=activeTrip().journals.filter(x=>String(x.id)!==String(id));saveState();renderJournal();closeModal()}}

function openCoupons(){renderCoupons();document.getElementById('coupon-modal').classList.remove('hidden')}function renderCoupons(){const box=document.getElementById('coupon-list');box.innerHTML='';for(const c of activeTrip().coupons||[]){const d=document.createElement('div');d.className='p-3 rounded-xl bg-white border border-sand';if(c.type==='url')d.innerHTML=`<div class="flex justify-between items-center"><b class="text-xs">${esc(c.name)}</b><a href="${esc(c.url)}" target="_blank" class="px-3 py-2 rounded-xl bg-sakuraLight text-torii text-xs font-bold">開啟</a></div>`;else d.innerHTML=`<button class="w-full text-left" onclick="openCouponImage('${c.id}')"><b class="text-xs">${esc(c.name)}</b><div class="text-[9px] text-gray-400">點擊查看優惠券</div></button>`;box.appendChild(d)}if(!box.children.length)box.innerHTML='<div class="text-center text-xs text-gray-400 py-6">尚無優惠券</div>'}async function openCouponImage(id){const c=activeTrip().coupons.find(x=>x.id===id);if(!c)return;openModal(c.name,`<img src="${esc(await mediaUrl(c.image))}" class="w-full h-auto rounded-xl">`)}function openCouponEditor(){document.getElementById('coupon-modal').classList.add('hidden');openModal('新增優惠券',`<input id="c-name" placeholder="優惠券名稱" class="w-full p-3 bg-white rounded-xl border border-sand"><select id="c-type" onchange="document.getElementById('c-url').classList.toggle('hidden',this.value!=='url');document.getElementById('c-img-row').classList.toggle('hidden',this.value!=='image')" class="w-full p-3 bg-white rounded-xl border border-sand"><option value="url">網址</option><option value="image">圖片</option></select><input id="c-url" placeholder="網址" class="w-full p-3 bg-white rounded-xl border border-sand"><label id="c-img-row" class="hidden block p-3 text-center bg-white border border-dashed border-sand rounded-xl">圖片<input id="c-img" type="file" accept="image/*" class="hidden"></label><button onclick="saveCoupon()" class="w-full py-3 bg-skyBlue text-white rounded-xl font-bold">新增</button>`)}asy function gatherMediaRefs(obj,set=new Set()){if(typeof obj==='string'&&isMediaRef(obj))set.add(obj);else if(Array.isArray(obj))obj.forEach(x=>gatherMediaRefs(x,set));else if(obj&&typeof obj==='object')Object.values(obj).forEach(x=>gatherMediaRefs(x,set));return set}async function exportActiveTrip(){const t=activeTrip(),refs=[...gatherMediaRefs(t)],media=[];for(const ref of refs){const r=await getMediaRecord(ref);if(r)media.push({id:r.id,type:r.type,createdAt:r.createdAt,data:await blobToDataURL(r.blob)})}const creds=await tripCredentials(),credentials=[];for(const x of creds)credentials.push({name:x.name,type:x.type,size:x.size,createdAt:x.createdAt,data:await blobToDataURL(x.blob)});downloadBlob(new Blob([JSON.stringify({app:'TripBook',version:15,exportedAt:new Date().toISOString(),trip:t,media,credentials})],{type:'application/json'}),`${t.info.title}_TripBook備份.json`)}async function importTripBackup(input){const f=input.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!p?.trip)throw new Error('格式錯誤');let t=p.trip;t.id=uid('trip');state.trips[t.id]=t;state.activeTripId=t.id;for(const m of p.media||[]){const blob=dataUrlBlob(m.data),db=await openMediaDB();await new Promise((ok,no)=>{const tx=db.transaction(MEDIA_STORE,'readwrite');tx.objectStore(MEDIA_STORE).put({id:m.id,blob,type:m.type,createdAt:m.createdAt});tx.oncomplete=ok;tx.onerror=()=>no(tx.error)})}saveState();for(const c of p.credentials||[]){const file=new File([dataUrlBlob(c.data)],c.name,{type:c.type});await saveCredential(file)}renderAll();showSplash();alert('旅程已匯入')}catch(e){alert('無法匯入：'+e.message)}finally{input.value=''}}function resetCurrentTrip(){if(!confirm('重製目前旅程？不影響其他旅程。'))return;const old=activeTrip(),info=deep(old.info),id=old.id,t=newTrip(info);t.id=id;t.info=info;state.trips[id]=t;saveState();currentDay=0;renderAll();showSplash()}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}function blobToDataURL(blob){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(blob)})}function dataUrlBlob(s){const[h,b]=s.split(','),type=(h.match(/data:([^;]+)/)||[])[1]||'application/octet-stream',bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})}
async function migrateLegacyMedia(){const t=activeTrip(),tasks=[];let changed=false;for(const d of t.days)for(const x of d.items||[])if(String(x.image||'').startsWith('data:image/'))tasks.push((async()=>{x.image=await putMediaDataUrl(x.image,'schedule');changed=true})());for(const x of t.expenses)if(String(x.receiptImage||'').startsWith('data:image/'))tasks.push((async()=>{x.receiptImage=await putMediaDataUrl(x.receiptImage,'receipt');changed=true})());for(const x of t.journals)if(String(x.img||'').startsWith('data:image/'))tasks.push((async()=>{x.img=await putMediaDataUrl(x.img,'journal');changed=true})());for(const a of Object.values(t.favorites||{}))for(const x of a||[])if(String(x.image||'').startsWith('data:image/'))tasks.push((async()=>{x.image=await putMediaDataUrl(x.image,'favorite');changed=true})());await Promise.allSettled(tasks);if(changed)saveState()}
